# Example workflow for your PlaceFinder fork: copy it to
# .github/workflows/deploy.yml. It builds the image, pushes it to the
# GitHub Container Registry and updates the container app, without
# stored Azure secrets.
#
# Repository variables (from "tofu output" of t08-iac/github-oidc and t08-iac/infra):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   RESOURCE_GROUP, CONTAINER_APP
name: deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write   # push to ghcr.io with GITHUB_TOKEN
  id-token: write   # needed to request the OIDC token

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}"
          docker build --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new image
        run: |
          az containerapp update --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --name "${{ vars.CONTAINER_APP }}" --image "$IMAGE"
